spring.application.name=personalized-budget-assistant

# --- MySQL Database Configuration ---
# Replace localhost:3306 with your MySQL host/port if different
spring.datasource.url=jdbc:mysql://localhost:3306/budgetdb
spring.datasource.username=root
spring.datasource.password=teejnam
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA/Hibernate Configuration ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 'update' is good for development; consider 'validate' or 'none' for production
spring.jpa.hibernate.ddl-auto=update

# --- Server Port Configuration ---
server.port=8080

# --- JWT Secret Key (Crucial for security) ---
# This is a base64 encoded string. In a real project, use a much longer, generated one.
# app.jwtSecret=YOUR_VERY_LONG_AND_SECURE_SECRET_KEY_GOES_HERE_FOR_TESTING_WITH_MYSQL
# app.jwtExpirationMs=86400000 # 24 hours in milliseconds